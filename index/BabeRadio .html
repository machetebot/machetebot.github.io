<!DOCTYPE html>
<html>
<head>
<title>Radio Player - radio player </title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=2.0, minimal-ui, shrink-to-fit=no">
</head>
<body style="text-align:center; margin:10px 0px 0px 0px;">
<!--PLAYER - Блок расположения плеера. Плееры: default, lite, energy или custom (свой плеер) (можно несколько) --><div id="my_player" class="my_player" data-player="energy" data-skin="blue" data-width=200 data-autoplay=1 data-volume=100 data-streamurl="https://myradio24.org/75176"></div><!--END PLAYER-->
<!--Этот скрипт должен располагаться в самом низу после всех блоков и не должен повторяться на странице. --><script src="//myradio24.com/player/player.js?v3.20" data-port="75176" data-interval=15></script>
<script>
var curtitle=document.title; var pos=-20;
window.setInterval(
	function() {
		curtitle=$('.my_marquee').html();
		var n=pos; if(n<0) n=0; var sub=curtitle.substr(n); pos++; if(!sub) {pos=-20; sub=curtitle;} if(n>=0) document.title=sub; 
	}
,400);
</script>
<br>


<!--JS - Функция для детальной настройки обновляемой информации. -->
<script>
var my_init_updateinfo=function(info) {
	//функция расширения полей трека на артиста и название
	function expand_song(song) {
		var pos=song.song.indexOf(' - ')
		var offset=0; if(pos>0) offset=pos+3;
		song.artist=song.song.substr(0,pos);
		song.songtitle=song.song.substr(offset);
	}
	//ОТОБРАЗИМ стол заказов, если включен (иначе скроем)
	if($("#my_table_on").length) {
		if(info.enabletable==3) {info.enabletable=2; if(info.live) info.enabletable=1;}
		$("#my_table_turn, .my_table_turn").html(info.turntable);
		$("#my_table_off").css('display', (info.enabletable==0?"block":"none") );	
		$("#my_table_on").css('display', (info.enabletable==1?"block":"none") );	
		$("#my_table_auto").css('display', (info.enabletable==2?"block":"none") );
	}
	//ОБНОВИМ информационные блоки
	info.listeners=info.listeners?info.listeners:"";
	info.isonline="<font color=red>оффлайн</font>"; 
	if(info.online==1) info.isonline="<font color=green>онлайн</font>"; 
	//получим новый трек в зависимости от формата array/object и расширим его артистом и названием
	var tmp=info.nextsongs[0]; if(typeof tmp === 'string') info.nextsongs[0]={song:tmp};
	expand_song(info.nextsongs[0]); //расширение
	var next=info.nextsongs[0];
	//назначение
	info.nextsong=next.song;
	info.htmllisteners=info.listeners?"&#127911; "+info.listeners:"";
	info.htmlimg="<img src='https://myradio24.com/"+info.img+"' width=300 border=0>";
	info.htmllogo=""; if(info.logo) info.htmllogo="<img src='https://myradio24.com/"+info.logo+"'>";
	info.htmlavatar=""; if(window.my_avatars && Array.isArray(my_avatars)) { if(my_avatars[info.djname]) info.htmlavatar=my_avatars[info.djname]; else if(my_avatars['']) info.htmlavatar=my_avatars['']; }
	//рейтинг ведущих
	var ranks=info.rank; var htmlranks="";
	if(ranks && ranks.length>0) {
		ranks.sort(function(a,b) {return b[1]-a[1];}); 
		for(var i=0;i<ranks.length;i++) {
			//данные ведущего в зависимости от формата array/object
			var rank=ranks[i]; if(Array.isArray(rank)) rank={djname:rank[0], rating:rank[1], hours:rank[2], count:rank[3], avatar:rank[4]};
			htmlranks+="<div style='display:inline-block; margin:5px;'><div style='float:left; width:100px; height:100px;  border:1px solid #ccc; border-radius:50px; background:url(https://myradio24.com/"+rank.avatar+"); background-size:cover;'></div>";
			htmlranks+="<div style='float:left; padding:15px 0 0 10px; text-align:left; width:110px;'><b>"+rank.djname+"</b><br>"+rank.count+" вещаний<br>"+rank.hours+" часов<br>"+rank.rating+" рейтинг</div></div>";
		}    
	}
	else htmlrank="Ничего не найдено.";
	info.htmlrank=htmlrank;
	//последние песни
	var songs=info.songs; var htmlsongs=""; 
	//console.dir(songs);
	if(songs && songs.length>0) {
		for(var i=0;i<songs.length;i++) {
			//данные трека в зависимости от формата array/object и расширим полями artist и songtitle
			if(Array.isArray(songs[i])) songs[i]={time:songs[i][0], song:songs[i][1], img:songs[i][2], songid:songs[i][3]};
			expand_song(songs[i]); //расширение
			var song=songs[i]; 				
			htmlsongs="<tr><td><div style='text-align:left; padding:4px;'>"+song.time.substr(0,5)+" - <a href='https://www.youtube.com/results?search_query="+encodeURIComponent(song.song)+"' target=_blank title='Найти на YouTube'>"+song.song+"</a> </td></tr>"+htmlsongs;
		} 
	htmlsongs="<table class='my_radio_width'>"+htmlsongs+"</table>";
	}
	else htmlsongs="Ничего не найдено.";
	info.htmlsongs=htmlsongs;
	//вставка переменных в data-myinfo
	$('[data-myinfo]').each(function() {
		var key=$(this).data('myinfo');
		if(key && info[key]) {
			if(key=='img') $(this).css('background-image','url('+info[key]+')');
			else $(this).html(info[key]); 
		}
	});
	//произведем замену переменных и выведем содержимое информера
	var objs=document.querySelectorAll(".my_info"); if(!objs.length) return; 
	if(!window.my_infohtml) my_infohtml={}; 
	for(var k=0;k<objs.length; k++) {
		if(!my_infohtml[k]) {my_infohtml[k]=objs[k].innerHTML; objs[k].style.visibility="visible";}
		var html=my_infohtml[k];
		for(var i in info) {html=html.replace(new RegExp("%"+i+"%","g"),info[i]);}
		objs[k].innerHTML=html;
	}
}
</script>
<!--END JS-->

</body>
</html>
