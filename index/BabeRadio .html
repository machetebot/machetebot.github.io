<!DOCTYPE html>
<html>
<head>
<title>Radio Player - radio player </title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=2.0, minimal-ui, shrink-to-fit=no">
</head>
<body style="text-align:center; margin:10px 0px 0px 0px;">
<!--PLAYER - Блок расположения плеера. Плееры: default, lite, energy или custom (свой плеер) (можно несколько) --><div id="my_player" class="my_player" data-player="energy" data-skin="blue" data-width=200 data-autoplay=1 data-volume=100 data-streamurl="https://myradio24.org/75176"></div><!--END PLAYER-->
<!--Этот скрипт должен располагаться в самом низу после всех блоков и не должен повторяться на странице. --><script src="//myradio24.com/player/player.js?v3.20" data-port="75176" data-interval=15></script>
<script>
var curtitle=document.title; var pos=-20;
window.setInterval(
	function() {
		curtitle=$('.my_marquee').html();
		var n=pos; if(n<0) n=0; var sub=curtitle.substr(n); pos++; if(!sub) {pos=-20; sub=curtitle;} if(n>=0) document.title=sub; 
	}
,400);
</script>

<!--TABLE - Блок расположения стола заказов. -->
<b>Стол заказов</b> (в очереди <b class=my_table_turn>0</b>)<br><br>
<div id=my_table_off>Сейчас заказы не принимаются.</div>
<div id=my_table_auto style="display:none;">
	<form action="https://myradio24.com/en/table/75176" method="post" target="_blank"><input type=submit value="Заказать музыку к исполнению"></form>
</div>
<div id=my_table_on style="display:none;">
	<form id=my_table_form action="" method=post accept-charset="UTF-8">	
		<input type=text id=my_table_from maxlength=30 value="" placeholder="От кого*">
		<input type=text id=my_table_for maxlength=30 value="" placeholder="Для кого">
		<br>
		<input type=text id=my_table_artist maxlength=50 value="" placeholder="Исполнитель*">
		<input type=text id=my_table_song maxlength=50 value="" placeholder="Название трека*">
		<br>
		<textarea id=my_table_comment cols=50 rows=3 maxlength=500 placeholder="Ваш комментарий"></textarea><br>
		* - поля обязательные для заполнения<br>
		<input type=submit value="Заказать музыку к исполнению">
	</form>
</div><br>
<!--END TABLE-->
</body>
</html>
